services:
  rinzo-database:
    image: postgres:16
    container_name: rinzo_postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rinzo-api:
    build:
      context: .
      dockerfile: Server/Rinzo.WebApi/Dockerfile
    container_name: rinzo_api
    depends_on:
      rinzo-database:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: rinzo-database
      ASPNETCORE_ENVIRONMENT: Development

volumes:
  db_data:

name: rinzo-project
