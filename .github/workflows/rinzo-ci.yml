name: RinzoCI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Server/Rinzo.sln

    - name: Build
      run: dotnet build --configuration Release Server/Rinzo.sln --no-restore

    - name: Test
      run: dotnet test --configuration Release Server/Rinzo.sln --no-build

    - name: Publish
      run: dotnet publish --configuration Release --output ./publish Server/Rinzo.WebApi --no-build
